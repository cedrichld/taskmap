<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>taskmap</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="header">
  <div class="hrow">
    <a class="brand" href="/" title="All projects">taskmap</a>
    <a class="allproj" href="/" title="All projects"><svg class="ic" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4L6 8l4 4"/></svg>All projects</a>
    <select id="project-select" aria-label="Project"></select>
    <span id="project-goal" class="pgoal"></span>
    <span class="spacer"></span>
    <span id="live" class="live connecting" title="Server-sent events feed"><i class="dot"></i><span id="live-text">connecting</span></span>
    <span id="updated" class="mono muted" title="map.updated"></span>
  </div>
  <div class="hrow">
    <div class="progress" title="done leaves / total leaves (skipped excluded)"><div id="progress-bar"></div></div>
    <span class="plabel"><span id="progress-label" class="mono">0/0</span> leaves</span>
    <span id="counts" class="counts"></span>
    <a id="now" class="now" href="#" hidden title="What Claude is working on. Click to open it."></a>
    <span class="spacer"></span>
    <div class="seg scope" role="group" aria-label="Scope">
      <button type="button" data-scope="open" aria-pressed="true" title="Only what is not finished yet">Open<span class="n mono" id="n-open"></span></button>
      <button type="button" data-scope="done" aria-pressed="false" title="Everything finished or dropped, newest first">Done<span class="n mono" id="n-done"></span></button>
      <button type="button" data-scope="all" aria-pressed="false" title="The whole map">All</button>
    </div>
    <div class="seg" role="group" aria-label="View">
      <button type="button" data-view="graph" aria-pressed="true">Graph</button>
      <button type="button" data-view="outline" aria-pressed="false">Outline</button>
    </div>
    <button type="button" id="fit-btn" title="Fit the map to the window (f)">Fit</button>
    <button type="button" id="add-top-btn" class="primary" aria-expanded="false"><span class="wide-only">Add high-level task</span><span class="narrow-only">Add task</span></button>
  </div>
  <form id="add-form" class="add-form" hidden>
    <input id="add-title" placeholder="Title" maxlength="200" autocomplete="off" required>
    <input id="add-what" placeholder="What (optional)" autocomplete="off">
    <input id="add-why" placeholder="Why (optional)" autocomplete="off">
    <button type="submit" class="primary">Add</button>
    <button type="button" id="add-cancel">Cancel</button>
    <span id="add-error" class="error" role="alert"></span>
  </form>
</header>

<div id="waiting" class="waiting" hidden>
  <span class="w-label">Waiting on you</span>
  <ul id="waiting-list"></ul>
</div>

<div id="body">
  <div id="sheet-backdrop" class="sheet-backdrop"></div>
  <main id="main" class="view-graph">
    <div id="notice" class="notice" hidden></div>
    <div id="graph" role="img" aria-label="Task map, a constellation of orbs">
      <canvas id="scene"></canvas>
      <div id="labels"></div>
    </div>
    <div id="outline"></div>
    <div id="donelist" class="donelist"></div>
    <div id="allopen" class="allopen" hidden>Nothing open. Everything on this map is finished; the <button type="button" class="linkish" data-scope="done">Done</button> tab has it.</div>
    <div id="empty" class="empty">No nodes yet. Claude adds them with <code>taskmap add</code>.</div>
  </main>

  <aside id="side">
    <div class="sheet-bar">
      <span class="sheet-grip" aria-hidden="true"></span>
      <button type="button" id="sheet-reply" class="primary">Message Claude</button>
      <button type="button" id="sheet-close" aria-label="Close the task panel">Close</button>
    </div>
    <section id="panel">
      <div id="panel-content" class="panel-content">
        <div class="placeholder">Pick an orb to see its details.</div>
      </div>
      <div id="panel-actions" class="panel-actions" hidden>
        <label class="k" for="fb-text">Message Claude about this task</label>
        <div class="composer">
          <textarea id="fb-text" rows="1" placeholder="Tell Claude something about this task…"></textarea>
          <div class="c-row">
            <span class="muted hint">Ctrl+Enter sends · read on the next <span class="mono">taskmap inbox</span></span>
            <button type="button" id="fb-send" class="primary" disabled>Send</button>
          </div>
        </div>
        <div class="btnrow actions">
          <button type="button" data-act="subtask">Add subtask</button>
          <button type="button" data-act="reopen">Reopen</button>
          <button type="button" data-act="block">Mark blocked</button>
          <button type="button" data-act="skip">Not needed</button>
          <button type="button" data-act="done">Mark done</button>
        </div>
        <form id="inline-form" class="inline-form" hidden>
          <label id="inline-label" class="k" for="inline-input"></label>
          <div class="btnrow">
            <input id="inline-input" autocomplete="off" maxlength="1000">
            <button type="submit" class="primary" id="inline-ok">OK</button>
            <button type="button" id="inline-cancel">Cancel</button>
          </div>
        </form>
        <div id="undo" class="toast" role="status" hidden>
          <span id="undo-msg" class="msg"></span>
          <button type="button" id="undo-btn">Undo</button>
        </div>
        <div id="panel-error" class="error" role="alert" hidden></div>
      </div>
    </section>
    <section id="activity">
      <button type="button" class="sec-head" id="activity-toggle" aria-expanded="true">
        <span>Activity</span>
        <span id="activity-count" class="muted mono"></span>
      </button>
      <div id="activity-list"></div>
    </section>
  </aside>
</div>

<script src="/vendor/d3.v7.min.js"></script>
<script src="/constellation.js"></script>
<script src="/app.js"></script>
</body>
</html>
