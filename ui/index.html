<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>taskmap — all projects</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="overview">
<header id="header">
  <div class="hrow">
    <h1 class="brand">taskmap</h1>
    <span class="pgoal">Everything this machine is working on</span>
    <span class="spacer"></span>
    <span id="ov-live" class="live connecting"><i class="dot"></i><span id="ov-live-text">loading</span></span>
  </div>
</header>

<main id="ov-main">
  <div id="ov-notice" class="notice" hidden></div>
  <ul id="ov-grid" class="ov-grid"></ul>
  <div id="ov-empty" class="empty" hidden>
    No projects yet. Run <code>taskmap init "&lt;name&gt;" --goal "&lt;one sentence&gt;"</code> in a project,
    or <code>taskmap demo</code> to see a finished one.
  </div>
</main>

<script src="/overview.js"></script>
</body>
</html>
